# Publishes docs/ to GitHub Pages with API key injected from Secrets.
# Settings → Pages → Source: GitHub Actions
#
# Secret: ELEVENLABS_API_KEY or VITE_ELEVENLABS_API_KEY

name: Deploy Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v5

      - name: Resolve API key
        id: apikey
        env:
          FROM_SECRET_VITE: ${{ secrets.VITE_ELEVENLABS_API_KEY }}
          FROM_SECRET: ${{ secrets.ELEVENLABS_API_KEY }}
          FROM_VAR_VITE: ${{ vars.VITE_ELEVENLABS_API_KEY }}
          FROM_VAR: ${{ vars.ELEVENLABS_API_KEY }}
        run: |
          key="${FROM_SECRET_VITE:-${FROM_SECRET:-${FROM_VAR_VITE:-$FROM_VAR}}}"
          if [ -z "$key" ]; then
            echo "::error::Missing ELEVENLABS_API_KEY. Add it at Settings → Secrets and variables → Actions (repository secret), then re-run this workflow."
            exit 1
          fi
          echo "::add-mask::$key"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Set GitHub Pages asset paths
        env:
          PAGES_BASE: /${{ github.event.repository.name }}
        run: |
          python3 <<'PY'
          import os, pathlib
          base = os.environ["PAGES_BASE"].rstrip("/")
          html_path = pathlib.Path("docs/index.html")
          js_path = pathlib.Path("docs/app.js")
          html = html_path.read_text(encoding="utf-8")
          # Absolutize relative asset links so pages work without trailing slash.
          for rel, abs_path in (
              ('href="./styles.css"', f'href="{base}/styles.css"'),
              ('src="./app.js"', f'src="{base}/app.js"'),
          ):
              if rel not in html:
                  raise SystemExit(f"Missing asset ref in index.html: {rel}")
              html = html.replace(rel, abs_path, 1)
          html_path.write_text(html, encoding="utf-8")
          js = js_path.read_text(encoding="utf-8")
          old = 'const BASE_RAW = "__BASE__";'
          new = f'const BASE_RAW = "{base}";'
          if old not in js:
              raise SystemExit("BASE_RAW placeholder not found in app.js")
          # Replace assignment only — never touch the "__BASE__" sentinel compare.
          js_path.write_text(js.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Inject API key into app.js
        env:
          API_KEY: ${{ steps.apikey.outputs.key }}
        run: |
          python3 -c "
          import json, os, pathlib
          p = pathlib.Path('docs/app.js')
          text = p.read_text(encoding='utf-8')
          quoted = json.dumps(os.environ['API_KEY'])
          old = 'const API_KEY = \"__INJECT_KEY__\";'
          if old not in text:
              raise SystemExit('Placeholder not found in app.js')
          p.write_text(text.replace(old, f'const API_KEY = {quoted};', 1), encoding='utf-8')
          "

      - name: Verify key was injected
        run: |
          if grep '^const API_KEY' docs/app.js | grep -q '__INJECT_KEY__'; then
            echo "::error::Klucz nie został wstrzyknięty do app.js"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
